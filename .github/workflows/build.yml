# Builds 2XPing.exe on every push / pull request.
# Pushing a tag like v0.9.0-beta also publishes a GitHub Release with the zip + SHA256
# (marked as pre-release while the tag contains "beta").
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -Release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: 2XPing
          path: release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 2X Ping ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          body_path: .github/release-notes.md
          files: |
            release/*.zip
            release/*.sha256
